[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tools-cabinet-api"
version = "0.1.0"
description = "Tools Cabinet API"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.10",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "azure-identity>=1.16",
    "azure-servicebus>=7.12",
    "azure-storage-blob>=12.20",
    "bcrypt>=4.1",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.9",
    "python-magic>=0.4.27",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.7",
]
