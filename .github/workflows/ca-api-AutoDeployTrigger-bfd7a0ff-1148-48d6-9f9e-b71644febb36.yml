name: Trigger auto deployment for ca-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-api-AutoDeployTrigger-bfd7a0ff-1148-48d6-9f9e-b71644febb36.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: crtoolscabinet-bjc7evb5dwbne6gg.azurecr.io
          registryUsername: ${{ secrets.CAAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAAPI_REGISTRY_PASSWORD }}
          containerAppName: ca-api
          resourceGroup: personal-utils
          imageToBuild: crtoolscabinet-bjc7evb5dwbne6gg.azurecr.io/ca-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


